[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasteflow-py"
version = "0.1.0"
description = "Python side of WasteFlow: GUI and simulation statistics"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0", "nicegui>=3.19"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]